  display: flex;
  justify-content: space-between;
  align-items: center;
}

.intention-label {
  font-size: 0.95rem;
  font-weight: 500;
  color: #f8fafc;
}

.cat-chip {
  font-size: 0.72rem;
  background: rgba(244, 114, 182, 0.18);
  color: #f472b6;
  padding: 2px 8px;
  border-radius: 9999px;
  font-weight: 600;
}

.intention-meta {
  display: flex;
  align-items: center;
  gap: 10px;
}

.seeds-earned-text {
  font-size: 0.75rem;
  color: #a7f3d0;
  font-weight: 600;
}

.nourished-badge {
  font-size: 0.75rem;
  color: #fde047;
  font-weight: 600;
}

/* Add Intention Form */
.add-intention-form {
  display: flex;
  gap: 10px;
  padding: 16px 24px;
  background: rgba(18, 28, 16, 0.7);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.intention-input {
  flex: 1;
  background: rgba(30, 48, 26, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 10px 14px;
  color: #fff;
  font-family: inherit;
  font-size: 0.92rem;
  outline: none;
}

.intention-input:focus {
  border-color: #34d399;
}

.intention-category-select {
  background: rgba(30, 48, 26, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 10px 12px;
  color: #fff;
  font-family: inherit;
  font-size: 0.85rem;
  outline: none;
}

.add-intention-btn {
  background: linear-gradient(180deg, #34d399 0%, #059669 100%);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 0 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.12s ease;
}

.add-intention-btn:hover {
  transform: translateY(-2px);
}

/* Colors utility */
.text-emerald { color: #34d399; }
.text-rose { color: #f472b6; }

/* Inspected Object Memory Card */
.memory-card {
  position: absolute;
  bottom: 30px;
  right: 30px;
  width: 320px;
  padding: 18px 20px;
  border-radius: 18px;
  z-index: 100;
  animation: floatUp 0.25s ease;
}

@keyframes floatUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.memory-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.memory-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 1.05rem;
  color: #a7f3d0;
}

.memory-close-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}

.memory-close-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
}

.memory-desc {
  font-size: 0.82rem;
  color: #cbd5e1;
  line-height: 1.4;
  margin-bottom: 12px;
}

.memory-dedication {
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.dedication-label {
  font-size: 0.72rem;
  color: #fde047;
  font-weight: 600;
}

.dedication-text {
  font-size: 0.85rem;
  color: #f8fafc;
  font-style: italic;
}

.dedication-input-row {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}

.dedication-edit-input {
  flex: 1;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  padding: 6px 10px;
  color: #fff;
  font-family: inherit;
  font-size: 0.82rem;
  outline: none;
}

.dedication-save-btn {
  background: #059669;
  border: none;
  color: #fff;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.78rem;
  cursor: pointer;
  font-weight: 600;
}

/* WARDROBE & ACTIVITIES MODAL */
.wardrobe-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(8, 14, 8, 0.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 250;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.22s ease-out;
}

.wardrobe-modal {
  width: 100%;
  max-width: 680px;
  max-height: 86vh;
  border-radius: 24px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(22, 33, 24, 0.94);
}

.wardrobe-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.wardrobe-title-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
}

.wardrobe-icon-bubble {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: rgba(245, 158, 11, 0.18);
  border: 1px solid rgba(245, 158, 11, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
}

.text-amber {
  color: #f59e0b;
}

.wardrobe-title-wrap h2 {
  font-size: 1.25rem;
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.2;
}

.wardrobe-sub {
  font-size: 0.8rem;
  color: #94a3b8;
}

/* Status Banner */
.villager-current-status-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0, 0, 0, 0.28);
  border: 1px solid rgba(255, 255, 255, 0.09);
  padding: 10px 16px;
  border-radius: 14px;
  font-size: 0.84rem;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-label {
  color: #94a3b8;
}

.status-value {
  color: #fde047;
  font-weight: 600;
}

.status-divider {
  color: rgba(255, 255, 255, 0.2);
}

/* Wardrobe Tabs */
.wardrobe-tabs {
  display: flex;
  gap: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding-bottom: 12px;
}

.wardrobe-tab-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 12px;
  color: #cbd5e1;
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
}

.wardrobe-tab-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
}

.wardrobe-tab-btn.active {
  background: rgba(16, 185, 129, 0.2);
  border-color: rgba(52, 211, 153, 0.45);
  color: #6ee7b7;
  box-shadow: 0 2px 10px rgba(16, 185, 129, 0.15);
}

/* Water Notice */
.water-suit-notice {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(6, 182, 212, 0.12);
  border: 1px solid rgba(6, 182, 212, 0.3);
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 0.82rem;
  color: #e0f2fe;
  margin-bottom: 14px;
}

.text-cyan {
  color: #38bdf8;
  flex-shrink: 0;
}

/* Tab Content Scroll Container */
.wardrobe-tab-content, .activities-tab-content {
  overflow-y: auto;
  max-height: calc(86vh - 230px);
  padding-right: 4px;
}

.wardrobe-tab-content::-webkit-scrollbar,
.activities-tab-content::-webkit-scrollbar {
  width: 6px;
}

.wardrobe-tab-content::-webkit-scrollbar-thumb,
.activities-tab-content::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 9999px;
}

/* Outfits Grid */
.outfits-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.outfit-card {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 16px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}

.outfit-card:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
}

.outfit-card.selected {
  background: rgba(16, 185, 129, 0.12);
  border-color: rgba(52, 211, 153, 0.5);
  box-shadow: 0 4px 16px rgba(16, 185, 129, 0.18);
}

.outfit-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.outfit-emoji-avatar {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.25);
  border: 2px solid #f59e0b;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}

.outfit-title-col {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}

.outfit-name-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.outfit-name {
  font-size: 0.95rem;
  color: #f8fafc;
}

.worn-pill {
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(16, 185, 129, 0.25);
  color: #6ee7b7;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 9999px;
  border: 1px solid rgba(52, 211, 153, 0.4);
}

.outfit-tag {
  font-size: 0.72rem;
  color: #a7f3d0;
}

.outfit-desc {
  font-size: 0.78rem;
  color: #94a3b8;
  line-height: 1.4;
  flex: 1;
}

.outfit-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 6px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.color-dots {
  display: flex;
  gap: 6px;
}

.color-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.4);
}

.wear-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #e2e8f0;
  border-radius: 10px;
  padding: 5px 12px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.16s ease;
}

.wear-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  color: #ffffff;
}

.wear-btn.active {
  background: #10b981;
  border-color: #34d399;
  color: #022c22;
}

/* Activities Grid */
.activities-intro {
  font-size: 0.84rem;
  color: #cbd5e1;
  margin-bottom: 12px;
}

.activities-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.activity-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 16px;
  padding: 12px 16px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.activity-card:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateX(-3px);
}

.activity-card.active {
  background: rgba(245, 158, 11, 0.12);
  border-color: rgba(245, 158, 11, 0.4);
}

.activity-icon-col {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}

.activity-info-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.activity-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.activity-name {
  font-size: 0.92rem;
  color: #f8fafc;
}

.active-badge {
  background: rgba(245, 158, 11, 0.25);
  color: #fde047;
  font-size: 0.68rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 9999px;
  border: 1px solid rgba(245, 158, 11, 0.4);
}

.activity-desc {
  font-size: 0.78rem;
  color: #94a3b8;
  line-height: 1.35;
}

.activity-warning-hint {
  font-size: 0.72rem;
  color: #fca5a5;
  margin-top: 2px;
}

.send-activity-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #e2e8f0;
  border-radius: 10px;
  padding: 7px 14px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.16s ease;
}

.send-activity-btn:hover {
  background: #059669;
  border-color: #34d399;
  color: #ffffff;
}

.send-activity-btn.current {
  background: #f59e0b;
  border-color: #fbbf24;
  color: #451a03;
}

/* Wardrobe Nav Button in Header */
.wardrobe-nav-btn {
  background: rgba(245, 158, 11, 0.22);
  border: 1px solid rgba(245, 158, 11, 0.4);
  color: #fef3c7;
}

.wardrobe-nav-btn:hover {
  background: rgba(245, 158, 11, 0.35);
  border-color: rgba(251, 191, 36, 0.6);
  color: #ffffff;
  transform: translateY(-1px);
}

/* Tree Fruit Action Row inside Inspected Object Memory Card */
.memory-action-row {
  margin-top: 14px;
  display: flex;
  justify-content: stretch;
}

.pick-tree-fruit-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.85), rgba(185, 28, 28, 0.9));
  color: #ffffff;
  border: 1px solid rgba(254, 202, 202, 0.35);
  border-radius: 12px;
  padding: 10px 16px;
  font-size: 0.88rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
  transition: all 0.18s ease;
}

.pick-tree-fruit-btn:hover {
  background: linear-gradient(135deg, rgba(248, 113, 113, 0.95), rgba(220, 38, 38, 0.95));
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
}

.pick-tree-fruit-btn:active {
  transform: translateY(0);
}

/* Header Styling Nav Button */
.styling-nav-btn {
  background: rgba(16, 185, 129, 0.22);
  border: 1px solid rgba(52, 211, 153, 0.4);
  color: #d1fae5;
}

.styling-nav-btn:hover {
  background: rgba(16, 185, 129, 0.35);
  border-color: rgba(52, 211, 153, 0.7);
  color: #ffffff;
  transform: translateY(-1px);
}

/* CHARACTER SIDE VIEW WIDGET (FLOATING ON SIDE) */
.character-side-pill-btn {
  position: absolute;
  left: 20px;
  bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px 10px 14px;
  border-radius: 9999px;
  background: rgba(20, 32, 18, 0.88);
  border: 1px solid rgba(110, 231, 183, 0.35);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  cursor: pointer;
  z-index: 90;
  transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.character-side-pill-btn:hover {
  transform: translateY(-3px) scale(1.03);
  border-color: rgba(110, 231, 183, 0.7);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
}

.side-pill-emoji {
  font-size: 1.5rem;
  line-height: 1;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.side-pill-text-col {
  display: flex;
  flex-direction: column;
  text-align: right;
}

.side-pill-title {
  font-size: 0.88rem;
  font-weight: 700;
  color: #f1f5f9;
}

.side-pill-sub {
  font-size: 0.7rem;
  color: #6ee7b7;
}

/* Open Character Side Panel */
.character-side-panel {
  position: absolute;
  left: 20px;
  bottom: 24px;
  width: 275px;
  background: rgba(17, 28, 16, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 24px;
  padding: 18px;
  z-index: 95;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(18px);
  animation: slideInSide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  direction: rtl;
}

@keyframes slideInSide {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.side-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.side-panel-title-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.side-panel-avatar-emoji {
  font-size: 1.5rem;
}

.side-panel-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: #f8fafc;
  margin: 0;
}

.side-panel-sub {
  font-size: 0.7rem;
  color: #94a3b8;
}

.side-panel-close-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #94a3b8;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
}

.side-panel-close-btn:hover {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
}

/* Portrait Canvas Box inside Side Panel */
.side-portrait-container {
  position: relative;
  background: radial-gradient(circle at 50% 60%, rgba(30, 58, 40, 0.6) 0%, rgba(10, 18, 12, 0.8) 100%);
  border: 1px solid rgba(110, 231, 183, 0.2);
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 0 10px;
  box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.35);
}

.villager-portrait-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
}

.villager-portrait-canvas {
  image-rendering: auto;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
}

.zoom-switch-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0, 0, 0, 0.45);
  padding: 3px 8px;
  border-radius: 9999px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  margin-top: 4px;
}

.zoom-label {
  font-size: 0.68rem;
  color: #94a3b8;
  display: flex;
  align-items: center;
  gap: 3px;
}

.zoom-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.14s ease;
}

.zoom-btn:hover {
  color: #ffffff;
}

.zoom-btn.active {
  background: #059669;
  color: #ffffff;
}

/* Side Villager Status Info */
.side-villager-info {
  margin: 12px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: rgba(255, 255, 255, 0.04);
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.side-info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.78rem;
}

.side-info-row .info-key {
  color: #94a3b8;
}

.side-info-row .info-val {
  font-weight: 600;
  color: #f1f5f9;
}

/* Action buttons in side panel */
.side-panel-actions {
  display: flex;
  gap: 8px;
}

.side-action-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 10px;
  border-radius: 12px;
  font-size: 0.78rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.16s ease;
}

.side-action-btn.styling-btn {
  background: rgba(16, 185, 129, 0.25);
  border-color: rgba(52, 211, 153, 0.45);
  color: #a7f3d0;
}

.side-action-btn.styling-btn:hover {
  background: #059669;
  color: #ffffff;
}
