      window.addEventListener('error', function(e) {
        console.error('Captured Window Error:', e.error || e.message);
        const el = document.createElement('pre');
        el.id = 'debug-error';
        el.style.cssText = 'color:#ff4444;background:#111;padding:20px;font-size:16px;position:fixed;top:0;left:0;right:0;z-index:999999;white-space:pre-wrap;';
        el.textContent = 'ERROR: ' + e.message + '\n' + (e.error ? e.error.stack : '');
        document.body.appendChild(el);
      });
